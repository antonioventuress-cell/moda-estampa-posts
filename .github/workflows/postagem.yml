name: postagem
# O agendamento grátis do GitHub atrasa horas (o "a cada 5 min" rodava a cada 2-5 h). Por isso:
# - o bot fica ~5h40 OUVINDO o Telegram (responde na hora) e o próximo já espera na fila pra assumir;
# - cada story tem 3 tentativas; a primeira que roda posta e as outras veem no estado que já foi.
on:
  schedule:
    - cron: "17 * * * *"            # bot: escuta longa (só um por vez; o seguinte espera)
    - cron: "7 9,10,11 * * *"       # bom dia: 6h07, 7h07 e 8h07 de Brasília
    - cron: "37 12,13,14 * * 2,3"   # promo (terça e quarta): 9h37, 10h37 e 11h37
  workflow_dispatch:
    inputs:
      tarefa: {type: choice, options: [bot, bom-dia, promo, conferir, previa], default: bot}

permissions:
  contents: write

jobs:
  postar:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    # um bot por vez (dois lendo o Telegram ao mesmo tempo dá conflito); stories numa fila separada
    concurrency: ${{ (github.event.schedule == '17 * * * *' || inputs.tarefa == 'bot') && 'bot' || 'stories' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip, cache-dependency-path: automacao/requirements.txt}
      - run: pip install -q -r automacao/requirements.txt
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: postar
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_CHAVE: ${{ secrets.IG_CHAVE }}
        run: |
          if [ -f automacao/ig_token.enc ]; then  # token renovado pelo token.yml
            IG_TOKEN=$(openssl enc -d -aes-256-cbc -pbkdf2 -base64 -A -pass env:IG_CHAVE -in automacao/ig_token.enc)
            echo "::add-mask::$IG_TOKEN"
            export IG_TOKEN
          fi
          case "${{ github.event.schedule }}" in
            "7 9,10,11 * * *") python automacao/postar.py bom-dia ;;
            "37 12,13,14 * * 2,3") python automacao/postar.py promo ;;
            "17 * * * *") python automacao/postar.py bot 20400 ;;  # 5h40 ouvindo
            *) [ "${{ inputs.tarefa }}" = bot ] && python automacao/postar.py bot 20400 || python automacao/postar.py "${{ inputs.tarefa }}" ;;
          esac
      - name: salvar fila e estado
        if: always()
        run: |
          git add -A
          git diff --cached --quiet && exit 0
          git commit -qm "bot: fila/estado"
          for i in 1 2 3; do git pull -q --rebase && git push -q && exit 0; sleep 5; done
          exit 1
