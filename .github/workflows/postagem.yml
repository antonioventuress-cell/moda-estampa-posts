name: postagem
on:
  schedule:
    - cron: "*/5 * * * *"    # bot do Telegram (o GitHub atrasa: na prática 5 a 15 min)
    - cron: "0 12 * * *"     # 9h de Brasília: story de bom dia
    - cron: "0 14 * * 2,3"   # 11h de terça e quarta: promo das 5 primeiras
  workflow_dispatch:
    inputs:
      tarefa: {type: choice, options: [bot, bom-dia, promo, conferir], default: bot}

permissions:
  contents: write

jobs:
  postar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # fila separada por tarefa: um bot pendente nunca cancela um story pendente
    concurrency: ${{ inputs.tarefa || github.event.schedule }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip, cache-dependency-path: automacao/requirements.txt}
      - run: pip install -q -r automacao/requirements.txt
      - name: postar
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
        run: |
          case "${{ github.event.schedule }}" in
            "0 12 * * *") TAREFA=bom-dia ;;
            "0 14 * * 2,3") TAREFA=promo ;;
            *) TAREFA="${{ inputs.tarefa || 'bot' }}" ;;
          esac
          python automacao/postar.py "$TAREFA"
      - name: salvar fila e estado
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -qm "bot: fila/estado"
          for i in 1 2 3; do git pull -q --rebase && git push -q && exit 0; sleep 5; done
          exit 1
