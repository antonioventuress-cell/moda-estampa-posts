name: postagem
# O agendamento grátis do GitHub atrasa horas ou nem dispara. Quem manda é o cron-job.org (automacao/DESPERTADOR.md):
# chama "relogio" a cada 15 min, que faz o que já está na hora (bom dia, post do dia, promo) e lê o Telegram.
# Os horários abaixo ficam só de reserva: cada coisa guarda o dia em que saiu, então nada repete.
on:
  schedule:
    - cron: "7 9,10,11 * * *"       # bom dia: 6h07, 7h07 e 8h07 de Brasília
    - cron: "7 18,19,20 * * 2,3"    # promo (terça e quarta): 15h07, 16h07 e 17h07
    - cron: "27 10,11,12 * * *"     # post do dia do banco/ (prévia pra aprovar): 7h27, 8h27 e 9h27
  workflow_dispatch:
    inputs:
      tarefa: {type: choice, options: [relogio, bot, sugerir, sugerir-video, bom-dia, promo, conferir, previa], default: relogio}

permissions:
  contents: write

jobs:
  postar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # uma execução por vez: duas lendo o Telegram ao mesmo tempo dá conflito, e o estado do dia fica consistente
    concurrency: postagem
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip, cache-dependency-path: automacao/requirements.txt}
      - run: pip install -q -r automacao/requirements.txt
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: postar
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_CHAVE: ${{ secrets.IG_CHAVE }}
        run: |
          if [ -f automacao/ig_token.enc ]; then  # token renovado pelo token.yml
            IG_TOKEN=$(openssl enc -d -aes-256-cbc -pbkdf2 -base64 -A -pass env:IG_CHAVE -in automacao/ig_token.enc)
            echo "::add-mask::$IG_TOKEN"
            export IG_TOKEN
          fi
          case "${{ github.event.schedule }}" in
            "7 9,10,11 * * *") python automacao/postar.py bom-dia ;;
            "7 18,19,20 * * 2,3") python automacao/postar.py promo ;;
            "27 10,11,12 * * *") python automacao/postar.py sugerir ;;
            *) python automacao/postar.py "${{ inputs.tarefa }}" ;;
          esac
      - name: salvar fila e estado
        if: always()
        run: |
          git add -A
          git diff --cached --quiet && exit 0
          git commit -qm "bot: fila/estado"
          for i in 1 2 3; do git pull -q --rebase && git push -q && exit 0; sleep 5; done
          exit 1
