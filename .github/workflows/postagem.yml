name: postagem
on:
  repository_dispatch:
    types: [telegram]        # o porteiro (Cloudflare) acorda isso na hora em que você manda algo no Telegram
  schedule:
    - cron: "0 12 * * *"     # 9h de Brasília: story de bom dia
    - cron: "0 14 * * 2,3"   # 11h de terça e quarta: promo das 5 primeiras
  workflow_dispatch:
    inputs:
      tarefa: {type: choice, options: [bom-dia, promo, webhook], default: bom-dia}

permissions:
  contents: read

jobs:
  postar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip, cache-dependency-path: automacao/requirements.txt}
      - run: pip install -q -r automacao/requirements.txt
      - name: postar
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          TG_SEGREDO: ${{ secrets.TG_SEGREDO }}
          CF_TOKEN: ${{ secrets.CF_TOKEN }}
          CF_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
          CF_KV_ID: ${{ vars.CF_KV_ID }}
          WORKER_URL: ${{ vars.WORKER_URL }}
        run: |
          case "${{ github.event_name }}/${{ github.event.schedule }}" in
            repository_dispatch/*) TAREFA=telegram ;;
            "schedule/0 12 * * *") TAREFA=bom-dia ;;
            "schedule/0 14 * * 2,3") TAREFA=promo ;;
            *) TAREFA="${{ inputs.tarefa }}" ;;
          esac
          python automacao/postar.py "$TAREFA"
